name = "sBPF Assembly"
grammar = "sbpf"
path_suffixes = ["s", "sbpf"]
line_comments = ["# ", "; ", "// "]
tab_size = 2
hard_tabs = false
brackets = [
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
